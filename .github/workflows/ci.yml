# Builds and tests every package on amd64 and arm64, inside the same ros-base
# image the devcontainer starts from. The steps are the ones a learner types.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  colcon:
    name: colcon (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install package dependencies
        run: |
          apt-get update
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src -y

      - name: Build (with exercise solutions)
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_cohesion+ \
            --cmake-args -DTUT_BUILD_SOLUTIONS=ON

      - name: Test
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --event-handlers console_cohesion+ --return-code-on-test-failure

      - name: Test results
        if: always()
        run: colcon test-result --verbose
