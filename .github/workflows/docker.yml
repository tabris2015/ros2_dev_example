# Proves both devcontainer targets build on amd64 and arm64, natively (QEMU
# would take 40+ minutes for `full`). Path-filtered because it is slow; run it
# by hand from the Actions tab when in doubt.
name: Docker images

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }} (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        target: [base, full]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.runner }}
